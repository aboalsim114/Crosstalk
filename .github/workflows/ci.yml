name: CI

# Git workflow (see CONTRIBUTING.md):
#   feature/fix/chore branches ──PR──▶ develop ──release PR──▶ main
# Every PR into develop or main, and every push to either, runs the full Windows
# build. Job names are stable because branch protection requires them by name.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Production only takes release PRs: from develop, or release/* and hotfix/* branches.
  release-gate:
    name: release-gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|release/*|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "::error::main only accepts PRs from develop, release/* or hotfix/* (got '$HEAD_REF'). Target develop instead."; exit 1 ;;
          esac

  windows:
    name: windows-build
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # whisper-rs-sys generates its bindings with bindgen (LLVM is preinstalled).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      # Non-negotiable constraint (docs/cahier-des-charges.md §3): Crosstalk never
      # opens, reads, writes or hooks another process. Comments are ignored.
      - name: Anti-cheat guard (no process access APIs)
        shell: bash
        run: |
          pattern='\b(OpenProcess|ReadProcessMemory|WriteProcessMemory|NtReadVirtualMemory|NtWriteVirtualMemory|VirtualAllocEx|CreateRemoteThread|SetWindowsHookEx[AW]?|DebugActiveProcess)\b'
          hits=$(grep -rnE "$pattern" src-tauri/src src-tauri/examples | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$hits" ]; then
            echo "::error::Forbidden process-access API used:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no process-access API in the Rust sources."

      - name: Typecheck UI
        run: npm run typecheck

      - name: Test UI
        run: npm test

      # The release build embeds dist/, so build the UI before the Rust checks.
      - name: Build UI
        run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows installers (NSIS + MSI)
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Build the audio probe and the ASR bench
        working-directory: src-tauri
        shell: bash
        run: |
          cargo build --release --locked --example audio_probe --example asr_bench --target x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/examples/audio_probe.exe target/x86_64-pc-windows-msvc/release/crosstalk-audio-probe.exe
          cp target/x86_64-pc-windows-msvc/release/examples/asr_bench.exe target/x86_64-pc-windows-msvc/release/crosstalk-asr-bench.exe
          # Flat artifact: the helper scripts sit next to the executables.
          cp ../scripts/download-models.ps1 ../scripts/fetch-asr-corpus.py target/x86_64-pc-windows-msvc/release/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: crosstalk-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/crosstalk.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/crosstalk-audio-probe.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/crosstalk-asr-bench.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/download-models.ps1
            src-tauri/target/x86_64-pc-windows-msvc/release/fetch-asr-corpus.py

  # Speech recognition measurements on a real Windows CPU with real models and a
  # public reference corpus (FLEURS ru/en). Informative: it depends on Hugging
  # Face being reachable, so it never blocks a merge. Results: job summary and
  # annotations.
  asr-bench:
    name: asr-bench
    runs-on: windows-latest
    timeout-minutes: 140
    continue-on-error: true
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CROSSTALK_MODELS_DIR: ${{ github.workspace }}\models
      # Experiment: whisper.cpp built by clang-cl (ggml's CPU kernels are
      # markedly slower with MSVC). The installer job still uses MSVC.
      CC: clang-cl
      CXX: clang-cl
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: asr-bench

      # Ninja + clang-cl need the MSVC developer environment (linker, SDK).
      - uses: ilammy/msvc-dev-cmd@v1

      # PowerShell, not bash: Git Bash's /usr/bin/link would shadow MSVC's link.exe.
      - name: Build the bench
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo build --release --locked --example asr_bench 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 15 | ForEach-Object { echo "::error title=bench build::$($_.Line)" }
            exit 1
          }

      - uses: actions/cache@v4
        with:
          path: models
          key: whisper-models-v1-tiny-base-small-silero512

      - name: Download models (checked by size and SHA-1)
        shell: pwsh
        run: ./scripts/download-models.ps1 -Models tiny,base,small -Dir models

      - name: Download the reference corpus (FLEURS dev, CC-BY-4.0)
        shell: bash
        run: python scripts/fetch-asr-corpus.py --out corpus --per-lang 8

      - name: Runner CPU
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          $n = [Environment]::ProcessorCount
          echo "::notice title=ASR runner::$cpu, $n threads logiques"
          echo "Processeur du runner : $cpu ($n threads logiques)" >> $env:GITHUB_STEP_SUMMARY

      # One step per measurement, each with its own time limit, so that a slow
      # model does not hide the results of the others.
      - name: False transcripts on synthetic combat noise (base)
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        run: scripts/ci-asr-bench.sh noise 480 --model base --noise-only 120

      - name: tiny (clean + combat)
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: scripts/ci-asr-bench.sh tiny 780 --model tiny --manifest corpus/manifest.tsv --scenario clean,combat

      - name: base (clean + combat)
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        run: scripts/ci-asr-bench.sh base 1080 --model base --manifest corpus/manifest.tsv --scenario clean,combat

      - name: small (clean)
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        run: scripts/ci-asr-bench.sh small 1080 --model small --manifest corpus/manifest.tsv --scenario clean

      - name: base with Whisper's full 30 s window (clean, for comparison)
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        run: scripts/ci-asr-bench.sh base-full 1080 --model base --full-encoder --manifest corpus/manifest.tsv --scenario clean
