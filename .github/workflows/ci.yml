name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 — test & package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck UI
        run: npm run typecheck

      - name: Test UI
        run: npm test

      # The release build embeds dist/, so build the UI before the Rust checks.
      - name: Build UI
        run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows installers (NSIS + MSI)
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: crosstalk-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/crosstalk.exe
