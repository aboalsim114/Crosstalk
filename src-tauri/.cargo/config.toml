# Static C runtime (/MT) for the Rust code of the MSVC build: nothing then
# depends on the Visual C++ redistributable, which Windows does not ship. The
# sherpa-onnx and ONNX Runtime DLLs shipped next to the exe are the "MT"
# builds of their release (static runtime too).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
