[package]
name = "crosstalk"
version = "0.4.1"
description = "Traduction en temps réel des voix et du chat de Counter-Strike 2"
authors = ["Crosstalk contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "crosstalk_lib"
# Desktop only: the binary links the rlib. The template's staticlib/cdylib are
# for Tauri mobile.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
# Speech recognition and the Silero VAD: sherpa-onnx (Apache-2.0) on ONNX
# Runtime (MIT), CPU, through its C API in two DLLs shipped next to the exe.
# Optional so the Windows target can be type-checked from Linux without the
# native libraries (`--no-default-features`). The prebuilt libraries come from
# the sherpa-onnx release, or from SHERPA_ONNX_LIB_DIR (scripts/fetch-sherpa-onnx.sh).
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"], optional = true }
# First-run download of the speech models (HTTPS with rustls, no OpenSSL),
# checked by exact size and SHA-256; also the LLM requests.
ureq = "2.12"
# SHA-256 of the downloaded models and of the update installer.
sha2 = "0.10"
# The Piper voice engine is downloaded as a zip (src/voice/catalog.rs).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Chat lines of console.log, matched by the rules file (src/chat/rules.json).
regex = "1"

[features]
default = ["asr"]
asr = ["dep:sherpa-onnx"]

# Native Windows APIs used by the audio capture (WASAPI) and the CS2 process
# watcher (Toolhelp snapshots: enumerates names and PIDs, never opens cs2.exe).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Wdk_System_SystemServices",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  # SendInput / GetAsyncKeyState: CS2 voice key held during the AI voice (voice/ptt.rs).
  "Win32_UI_Input_KeyboardAndMouse",
  # "Qui parle ?": Windows' built-in OCR (src/speaker).
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
] }
windows-core = "0.62"

# Inference runs in the prebuilt sherpa-onnx / ONNX Runtime libraries: the
# Rust code itself is optimised for size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# sherpa-onnx-sys 1.13.8 asks for zip 2, whose releases are all yanked: same
# crate (Apache-2.0), build dependency moved to zip 9 (vendor/sherpa-onnx-sys).
[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }
